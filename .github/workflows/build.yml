name: Build APK & AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (only if secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease assembleRelease --stacktrace

      - name: Upload debug APK (install on your phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCounter-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCounter-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCounter-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish test APK as a GitHub Release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "ScrollCounter-v${VERSION}-test.apk"
          gh release create "$TAG" "ScrollCounter-v${VERSION}-test.apk" \
            --title "Scroll Counter v${VERSION} (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Fast optimized test APK (release build, test key). For the Play Store, upload the AAB signed with your own key." \
            --latest
